<?xml version="1.0" encoding="UTF-8"?>
<!DOCTYPE html>
<html
    xmlns="http://www.w3.org/1999/xhtml"
    xmlns:h="http://xmlns.jcp.org/jsf/html"
    xmlns:f="http://xmlns.jcp.org/jsf/core"
    xmlns:ui="http://xmlns.jcp.org/jsf/facelets"
    xmlns:p="http://primefaces.org/ui"
>
    <h:head>
        <meta charset="utf-8" />
        <meta http-equiv="X-UA-Compatible" content="IE=edge" />
        <meta
            name="viewport"
            content="width=device-width, initial-scale=1, maximum-scale=1, user-scalable=no"
        />
        <meta name="apple-mobile-web-app-capable" content="yes" />
        <meta name="mobile-web-app-capable" content="yes" />

        <h:outputStylesheet library="css" name="adminlte.min.css" />
        <h:outputStylesheet library="css" name="style.css" />
        <h:outputStylesheet library="css" name="customStyle.css" />

        <style>
            aside.main-sidebar,
            .sidebar-dark-primary {
                background-color: #1b2a47 !important;
            }
            .brand-link {
                background-color: #152238 !important;
                border-bottom: 1px solid #2c3e50 !important;
                padding: 1rem 1.25rem;
                display: block;
                text-decoration: none;
            }
            .brand-text {
                font-size: 1.1rem;
                font-weight: 600;
                color: #ffffff !important;
                margin-left: 0.5rem;
            }
            .sidebar .nav-sidebar .nav-item .nav-link {
                color: #c2c7d0;
                padding: 0.75rem 1rem;
            }
            .sidebar .nav-sidebar .nav-item .nav-link:hover,
            .sidebar .nav-sidebar .nav-item .nav-link.active {
                background-color: #1b2a47 !important;
                color: #ffffff !important;
            }
            .sidebar .nav-sidebar .nav-treeview .nav-link {
                padding-left: 2.5rem;
            }
            .dialog-title-accent {
                border-left: 4px solid #2373f4 !important;
                padding-left: 10px !important;
                margin-left: -4px;
                line-height: 1.2;
            }

            /* Card Left Accent Utility Style */
            .card-left-accent {
                border-left: 9px solid #2373f4 !important;
            }

            .rounded-dialog .ui-dialog-content {
                border-bottom-left-radius: 8px;
                border-bottom-right-radius: 8px;
            }
            .rounded-dialog.ui-dialog {
                border-radius: 10px;
                overflow: hidden;
                box-shadow: 0 10px 25px rgba(0, 0, 0, 0.15) !important;
                border: none;
            }
            .rounded-dialog .ui-dialog-titlebar {
                border-top-left-radius: 10px;
                border-top-right-radius: 10px;
                border-bottom: 1px solid #dee2e6;
            }

            .ui-button.btn-lightblue {
                background-color: lightblue !important;
                border-color: lightblue !important;
                color: #212529 !important; /* Dark text for contrast */
            }
            .ui-button.btn-lightblue:hover {
                background-color: #87ceeb !important; /* Slightly darker shade on hover */
                border-color: #7ab8d8 !important;
            }
        </style>

        <title>DDA | Jasper Generate</title>
    </h:head>

    <h:body styleClass="hold-transition sidebar-mini layout-footer-fixed">
        <div class="wrapper">
            <!-- Sidebar Section -->
            <aside
                id="main-sidebar"
                class="main-sidebar sidebar-dark-primary elevation-4"
            >
                <a
                    href="#{request.contextPath}/reportGenerationPage.xhtml"
                    class="brand-link"
                >
                    <span class="brand-text">Jasper ReportGenerate</span>
                </a>
                <div class="sidebar">
                    <nav class="mt-3">
                        <ul
                            class="nav nav-pills nav-sidebar flex-column"
                            data-widget="treeview"
                            role="menu"
                            data-accordion="false"
                        >
                            <li class="nav-item">
                                <h:outputLink
                                    value="#{request.contextPath}/reportGenerationPage.xhtml"
                                    styleClass="nav-link active"
                                >
                                    <i class="nav-icon pi pi-file-pdf"></i>
                                    <p>Report Generate PDF</p>
                                </h:outputLink>
                            </li>
                        </ul>
                    </nav>
                </div>
            </aside>

            <!-- Main Content Area Wrapper -->
            <div class="contentbox content-wrapper" id="contentbox">
                <div
                    style="
                        width: 100%;
                        background-color: #ffffff;
                        min-height: calc(100vh - 57px);
                        padding: 20px;
                    "
                >
                    <div class="card shadow mb-4" style="padding: 20px">
                        <p:growl
                            id="growl"
                            showSummary="true"
                            showDetail="true"
                            life="4000"
                        >
                            <p:autoUpdate />
                        </p:growl>

                        <h:form id="reportgenerationform">
                            <p:messages
                                id="message"
                                showDetail="true"
                                closable="true"
                            >
                                <p:autoUpdate />
                            </p:messages>

                            <p:panel header="Report Generation">
                                <p:panelGrid
                                    columns="3"
                                    layout="grid"
                                    styleClass="ui-panelgrid-blank ui-fluid report-selection-grid"
                                >
                                    <p:outputLabel
                                        value="Report Type"
                                        style="
                                            font-size: 14px;
                                            font-weight: normal;
                                            margin-top: 0.5rem;
                                        "
                                    />
                                    <p:selectOneMenu
                                        style="width: 100%"
                                        id="option"
                                        value="#{reportTypeSelection.reportType}"
                                    >
                                        <f:selectItem
                                            itemLabel="Select One"
                                            itemValue=""
                                            noSelectionOption="true"
                                        />
                                        <f:selectItems
                                            value="#{reportTypeSelection.reportTypes}"
                                        />
                                    </p:selectOneMenu>
                                    <p:commandButton
                                        id="proceedBtn"
                                        value="Proceed"
                                        icon="pi pi-arrow-right"
                                        iconPos="right"
                                        styleClass="ui-button-primary w-full"
                                        action="#{reportTypeSelection.handleProceed}"
                                        process="@form"
                                        update=":reportgenerationform:option"
                                    />
                                </p:panelGrid>
                            </p:panel>

                            <!-- 1. DTDTS Dialog -->
                            <p:dialog
                                id="reportFilterDialog"
                                widgetVar="reportFilterDialog"
                                modal="true"
                                responsive="true"
                                width="850"
                                focus="closebtn"
                                styleClass="rounded-dialog card-left-accent"
                            >
                                <f:facet name="header">
                                    <span class="dialog-title-accent">
                                        DTDTS Report Filters
                                    </span>
                                </f:facet>

                                <p:panelGrid
                                    columns="4"
                                    layout="grid"
                                    styleClass="ui-panelgrid-blank ui-fluid"
                                    style="padding: 10px"
                                >
                                    <!-- Date From -->
                                    <p:outputLabel
                                        for="dtdtsFrom"
                                        value="Date From:"
                                        style="
                                            font-size: 14px;
                                            font-weight: normal;
                                            margin-top: 0.5rem;
                                        "
                                    />

                                    <p:datePicker
                                        id="dtdtsFrom"
                                        value="#{generateBeanDTDTS.fromDate}"
                                        pattern="MM/dd/yyyy"
                                        showIcon="true"
                                        style="width: 100%"
                                    >
                                        <f:convertDateTime
                                            pattern="MM/dd/yyyy"
                                        />
                                    </p:datePicker>

                                    <!-- Date To -->
                                    <p:outputLabel
                                        for="dtdtsTo"
                                        value="Date To:"
                                        style="
                                            font-size: 14px;
                                            font-weight: normal;
                                            margin-top: 0.5rem;
                                        "
                                    />

                                    <p:datePicker
                                        id="dtdtsTo"
                                        value="#{generateBeanDTDTS.toDate}"
                                        pattern="MM/dd/yyyy"
                                        showIcon="true"
                                        style="width: 100%"
                                    >
                                        <f:convertDateTime
                                            pattern="MM/dd/yyyy"
                                        />
                                    </p:datePicker>

                                    <!-- Ticket From -->
                                    <p:outputLabel
                                        for="ticketNoFromDtdts"
                                        value="Ticket No. From:"
                                        style="
                                            font-size: 14px;
                                            font-weight: normal;
                                            margin-top: 0.5rem;
                                        "
                                    />

                                    <p:inputText
                                        id="ticketNoFromDtdts"
                                        value="#{generateBeanDTDTS.ticketNoFrom}"
                                        style="width: 100%; font-size: 14px"
                                    />

                                    <!-- Ticket To -->
                                    <p:outputLabel
                                        for="ticketNoToDtdts"
                                        value="Ticket No. To:"
                                        style="
                                            font-size: 14px;
                                            font-weight: normal;
                                            margin-top: 0.5rem;
                                        "
                                    />

                                    <p:inputText
                                        id="ticketNoToDtdts"
                                        value="#{generateBeanDTDTS.ticketNoTo}"
                                        style="width: 100%; font-size: 14px"
                                    />

                                    <!-- Organization Code -->
                                    <p:outputLabel
                                        for="orgaCodeDtdts"
                                        value="Org Code:"
                                        style="
                                            font-size: 14px;
                                            font-weight: normal;
                                            margin-top: 0.5rem;
                                        "
                                    />

                                    <p:inputText
                                        id="orgaCodeDtdts"
                                        value="#{generateBeanDTDTS.orgaCode}"
                                        maxlength="3"
                                        style="width: 100%; font-size: 14px"
                                    />
                                </p:panelGrid>

                                <f:facet name="footer">
                                    <!-- SUBMIT DTDTS -->
                                    <p:commandButton
                                        id="submitDtdts"
                                        value="Submit"
                                        icon="pi pi-check"
                                        styleClass="ui-button-success"
                                        action="#{generateBeanDTDTS.generatePdf}"
                                        process="@form"
                                        update=":reportgenerationform:message :reportgenerationform:dtdtsReportPreview"
                                    />

                                    <!-- CLOSE -->
                                    <p:commandButton
                                        id="closebtn"
                                        value="Close"
                                        icon="pi pi-times"
                                        type="button"
                                        onclick="
                                            PF('reportFilterDialog').hide()
                                        "
                                        styleClass="ui-button-secondary"
                                    />
                                </f:facet>
                            </p:dialog>

                            <!-- 2. DDSOA Dialog -->
                            <p:dialog
                                id="ddsoaFilterDialog"
                                widgetVar="ddsoaFilterDialog"
                                modal="true"
                                responsive="true"
                                width="850"
                                focus="closeddsoabtn"
                                styleClass="rounded-dialog card-left-accent"
                            >
                                <f:facet name="header">
                                    <span class="dialog-title-accent"
                                        >DDSOA Report Filters</span
                                    >
                                </f:facet>

                                <p:panelGrid
                                    columns="4"
                                    layout="grid"
                                    styleClass="ui-panelgrid-blank ui-fluid"
                                    style="padding: 10px"
                                >
                                    <p:outputLabel
                                        for="ddsoaFrom"
                                        value="Date From:"
                                        style="
                                            font-size: 14px;
                                            font-weight: normal;
                                            margin-top: 0.5rem;
                                        "
                                    />
                                    <p:datePicker
                                        id="ddsoaFrom"
                                        value="#{generateBean.fromDate}"
                                        pattern="MM/dd/yyyy"
                                        showIcon="true"
                                        style="width: 100%"
                                    >
                                        <f:convertDateTime
                                            pattern="MM/dd/yyyy"
                                        />
                                    </p:datePicker>

                                    <p:outputLabel
                                        for="ddsoaTo"
                                        value="Date To:"
                                        style="
                                            font-size: 14px;
                                            font-weight: normal;
                                            margin-top: 0.5rem;
                                        "
                                    />
                                    <p:datePicker
                                        id="ddsoaTo"
                                        value="#{generateBean.toDate}"
                                        pattern="MM/dd/yyyy"
                                        showIcon="true"
                                        style="width: 100%"
                                    >
                                        <f:convertDateTime
                                            pattern="MM/dd/yyyy"
                                        />
                                    </p:datePicker>

                                    <p:outputLabel
                                        for="ticketNoFromDdsoa"
                                        value="Ticket No. From:"
                                        style="
                                            font-size: 14px;
                                            font-weight: normal;
                                            margin-top: 0.5rem;
                                        "
                                    />
                                    <p:inputText
                                        id="ticketNoFromDdsoa"
                                        value="#{generateBean.ticketNoFrom}"
                                        style="width: 100%; font-size: 14px"
                                    />

                                    <p:outputLabel
                                        for="ticketNoToDdsoa"
                                        value="Ticket No. To:"
                                        style="
                                            font-size: 14px;
                                            font-weight: normal;
                                            margin-top: 0.5rem;
                                        "
                                    />
                                    <p:inputText
                                        id="ticketNoToDdsoa"
                                        value="#{generateBean.ticketNoTo}"
                                        style="width: 100%; font-size: 14px"
                                    />

                                    <p:outputLabel
                                        for="ddsoaOrgaCode"
                                        value="Organization Unit Code:"
                                        style="
                                            font-size: 14px;
                                            font-weight: normal;
                                            margin-top: 0.5rem;
                                        "
                                    />
                                    <p:inputText
                                        id="ddsoaOrgaCode"
                                        value="#{generateBean.orgaCode}"
                                        style="width: 100%"
                                        maxlength="3"
                                    />

                                    <h:outputText value="" />
                                    <h:outputText value="" />
                                </p:panelGrid>

                                <f:facet name="footer">
                                    <p:commandButton
                                        value="Submit"
                                        icon="pi pi-check"
                                        styleClass="ui-button-success"
                                        action="#{generateBean.generateDdsoaPdf}"
                                        process="@form"
                                        update=":reportgenerationform:message :reportgenerationform:ddsoaReportPreview"
                                    />
                                    <p:commandButton
                                        id="closeddsoabtn"
                                        value="Close"
                                        icon="pi pi-times"
                                        type="button"
                                        onclick="PF('ddsoaFilterDialog').hide()"
                                        styleClass="ui-button-secondary"
                                    />
                                </f:facet>
                            </p:dialog>

                            <!-- 3. Test Jasper Dialog -->
                            <p:dialog
                                id="activityReportDialog"
                                widgetVar="activityReportDialog"
                                modal="true"
                                responsive="true"
                                width="700"
                                focus="closeTestBtn"
                                styleClass="rounded-dialog card-left-accent"
                            >
                                <f:facet name="header">
                                    <span class="dialog-title-accent"
                                        >Jasper Generate</span
                                    >
                                </f:facet>

                                <div class="form-section">
                                    <div class="form-section-title">
                                        <i class="pi pi-filter"></i> Filter
                                        Criteria
                                    </div>
                                    <div class="field-group">
                                        <label for="testFilterInput"
                                            >Ticket No:</label
                                        >
                                        <p:inputText
                                            id="testFilterInput"
                                            value="#{generateSingleFilterBean.testFilter}"
                                        />
                                    </div>
                                </div>

                                <f:facet name="footer">
                                    <p:commandButton
                                        value="Submit"
                                        icon="pi pi-check"
                                        styleClass="btn-submit"
                                        action="#{generateSingleFilterBean.generateSingleFilterBeanAction}"
                                        process="@form"
                                        update=":reportgenerationform:message :reportgenerationform:testJasperReportPreview"
                                    />
                                    <p:commandButton
                                        id="closeTestBtn"
                                        value="Close"
                                        icon="pi pi-times"
                                        type="button"
                                        onclick="PF('testFilterDialog').hide()"
                                        styleClass="btn-cancel"
                                    />
                                </f:facet>
                            </p:dialog>

                            <!-- REPORT PREVIEW -->
                            <!-- TEST JASPER PREVIEW -->
                            <p:outputPanel
                                id="testJasperReportPreview"
                                style="display: block; margin-top: 20px"
                            >
                                <h:panelGroup
                                    rendered="#{generateSingleFilterBean.reportGenerated}"
                                >
                                    <object
                                        data="data:application/pdf;base64,#{generateSingleFilterBean.pdfBase64}"
                                        type="application/pdf"
                                        width="100%"
                                        height="600px"
                                    >
                                        Your browser does not support PDFs.
                                    </object>
                                </h:panelGroup>
                            </p:outputPanel>

                            <!-- DTDTS -->
                            <p:outputPanel
                                id="dtdtsReportPreview"
                                style="display: block; margin-top: 20px"
                            >
                                <h:panelGroup
                                    rendered="#{generateBeanDTDTS.reportGenerated}"
                                >
                                    <object
                                        data="data:application/pdf;base64,#{generateBeanDTDTS.pdfBase64}"
                                        type="application/pdf"
                                        width="100%"
                                        height="600px"
                                    >
                                        Your browser does not support PDFs.
                                    </object>
                                </h:panelGroup>
                            </p:outputPanel>

                            <!-- DDSOA -->
                            <p:outputPanel
                                id="ddsoaReportPreview"
                                style="display: block; margin-top: 20px"
                            >
                                <h:panelGroup
                                    rendered="#{generateBean.reportGenerated}"
                                >
                                    <object
                                        data="data:application/pdf;base64,#{generateBean.pdfBase64}"
                                        type="application/pdf"
                                        width="100%"
                                        height="600px"
                                    >
                                        Your browser does not support PDFs.
                                    </object>
                                </h:panelGroup>
                            </p:outputPanel>
                        </h:form>
                    </div>
                </div>
            </div>
        </div>

        <!-- Core Scripts -->
        <script src="#{resource['js/adminlte.min.js']}" nonce="DDA"></script>
        <script src="#{resource['js/settings.js']}" nonce="DDA"></script>
        <script
            src="#{resource['js/bootstrap/bootstrap.bundle.min.js']}"
        ></script>
    </h:body>
</html>
